<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classroom Reservation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --ink:#172033;
    --ink-soft:#667085;
    --forest:#5558e9;
    --forest-light:#4145d7;
    --brass:#f6af3f;
    --vacant:#0a9d7f;
    --vacant-bg:#e3f8f2;
    --occupied:#d94d61;
    --occupied-bg:#ffe9ed;
    --pending:#d88a1c;
    --pending-bg:#fff2db;
    --border:#e5eaf2;
    --navy:#111b38;
    --navy-soft:#1b2950;
    --radius:18px;
    --shadow:0 18px 50px rgba(39, 55, 93, 0.10);
  }
  *{box-sizing:border-box;}
  html{min-height:100%;background:var(--bg);}
  body{min-height:100vh;margin:0;background:radial-gradient(circle at 85% -10%,#e3e7ff 0,rgba(227,231,255,0) 27rem),var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Source Serif 4',serif;margin:0;font-weight:600;letter-spacing:-0.025em;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease;}
  input,select{font-family:inherit;}
  ::selection{background:#cfd0ff;color:var(--ink);}

  .eyebrow{color:var(--forest);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}

  /* ---------- Login ---------- */
  .login-wrap{position:relative;isolation:isolate;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;overflow:hidden;}
  .login-wrap::before,.login-wrap::after{content:'';position:absolute;z-index:-1;border-radius:999px;filter:blur(1px);}
  .login-wrap::before{width:34rem;height:34rem;left:-16rem;bottom:-16rem;background:linear-gradient(135deg,#dce1ff,#dff9f4);}
  .login-wrap::after{width:28rem;height:28rem;right:-10rem;top:-13rem;background:linear-gradient(135deg,#fff0cc,#e4e6ff);}
  .login-card{width:100%;max-width:450px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:42px 40px;box-shadow:0 28px 75px rgba(35,49,91,.16);backdrop-filter:blur(16px);}
  .plate{display:flex;align-items:center;gap:14px;margin-bottom:34px;}
  .plate-num{width:50px;height:50px;border-radius:15px;background:linear-gradient(145deg,#6064f1,#3f43ce);box-shadow:0 8px 18px rgba(75,78,221,.28);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;letter-spacing:1px;}
  .plate-title{font-size:23px;line-height:1.05;}
  .plate-sub{font-size:12.5px;color:var(--ink-soft);margin-top:5px;}
  .field{margin-bottom:17px;}
  .field label{display:block;font-size:12px;font-weight:600;color:#4d5b73;margin:0 0 7px 2px;}
  .field input,.field select{width:100%;min-height:43px;padding:10px 13px;border:1px solid var(--border);border-radius:11px;background:#fff;font-size:14px;color:var(--ink);box-shadow:0 1px 2px rgba(26,39,73,.02);transition:border-color .18s ease,box-shadow .18s ease;}
  .field input::placeholder{color:#a7b0c0;}
  .field input:focus,.field select:focus{outline:none;border-color:#8e90f5;box-shadow:0 0 0 4px rgba(85,88,233,.12);}
  .role-pick{display:flex;gap:7px;padding:4px;background:#f5f7fb;border-radius:12px;}
  .role-pick button{flex:1;padding:8px 4px;border:1px solid transparent;background:transparent;border-radius:8px;font-size:12px;color:var(--ink-soft);}
  .role-pick button.active{background:#fff;color:var(--forest);border-color:#e9ebff;box-shadow:0 2px 5px rgba(35,49,91,.08);font-weight:600;}
  .btn-primary{width:100%;min-height:45px;padding:11px 16px;border:1px solid var(--forest);border-radius:11px;background:var(--forest);box-shadow:0 8px 14px rgba(85,88,233,.22);color:#fff;font-size:14px;font-weight:600;margin-top:5px;}
  .btn-primary:hover{background:var(--forest-light);border-color:var(--forest-light);transform:translateY(-1px);box-shadow:0 10px 18px rgba(85,88,233,.28);}
  .switch-line{text-align:center;margin-top:20px;font-size:13px;color:var(--ink-soft);}
  .switch-line a{color:var(--forest);cursor:pointer;font-weight:700;}
  .switch-line a:hover{text-decoration:underline;}
  .err{background:var(--occupied-bg);color:#b33b4d;border:1px solid #ffd5dc;border-radius:11px;padding:10px 12px;font-size:12.5px;margin-bottom:18px;}
  .server-note{margin-bottom:18px;padding:11px 12px;border:1px solid #f2dda6;border-radius:11px;background:#fff8e8;color:#8b621b;font-size:12px;line-height:1.5;}
  .server-note code{padding:1px 4px;border-radius:4px;background:#fff0c9;color:#63440a;font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .hint{font-size:12px;color:var(--ink-soft);line-height:1.5;}

  /* ---------- App shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:266px;min-height:100vh;background:linear-gradient(180deg,#111b38 0%,#17254a 100%);color:#eaf0ff;padding:25px 15px 18px;display:flex;flex-direction:column;flex-shrink:0;box-shadow:12px 0 36px rgba(17,27,56,.05);}
  .sb-plate{display:flex;align-items:center;gap:11px;margin:0 7px 29px;padding:0 0 24px;border-bottom:1px solid rgba(217,228,255,.12);}
  .sb-num{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#f7c65f,#f4a53f);box-shadow:0 7px 15px rgba(0,0,0,.2);color:#18223d;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;}
  .sb-name{font-size:13px;font-weight:600;letter-spacing:.01em;}
  .sb-role{font-size:10px;color:#a6b5d6;margin-top:2px;text-transform:capitalize;letter-spacing:.04em;}
  .nav-item{position:relative;display:flex;width:100%;align-items:center;text-align:left;background:none;border:1px solid transparent;color:#b7c3df;padding:11px 13px;border-radius:11px;font-size:13px;font-weight:500;margin-bottom:4px;}
  .nav-item::before{content:'';width:5px;height:5px;margin-right:11px;border-radius:50%;background:currentColor;opacity:.7;}
  .nav-item:hover{background:rgba(255,255,255,.07);color:#eef3ff;}
  .nav-item.active{background:linear-gradient(90deg,rgba(111,117,253,.30),rgba(111,117,253,.15));border-color:rgba(154,158,255,.24);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #aeb0ff;}
  .sb-spacer{flex:1;}
  .logout-btn{color:#b7c3df;background:rgba(255,255,255,.04);border:1px solid rgba(217,228,255,.14);padding:10px 12px;border-radius:10px;font-size:12.5px;text-align:left;}
  .logout-btn:hover{color:#fff;background:rgba(255,255,255,.09);border-color:rgba(217,228,255,.28);}
  .main{width:100%;max-width:1280px;padding:48px 56px 50px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:40px;}
  .topbar-brand{display:flex;align-items:center;gap:10px;color:#8792a8;font-size:12px;font-weight:500;}
  .topbar-brand .pulse{width:8px;height:8px;background:var(--vacant);border-radius:50%;box-shadow:0 0 0 5px var(--vacant-bg);}
  .topbar-user{display:flex;align-items:center;gap:9px;color:#59667c;font-size:12px;font-weight:600;}
  .topbar-user .avatar{width:30px;height:30px;font-size:10px;}
  .page-head{margin-bottom:27px;}
  .page-head h2{font-size:32px;line-height:1.08;}
  .page-head p{color:var(--ink-soft);font-size:14px;line-height:1.55;margin-top:8px;}

  /* ---------- Cards / lists ---------- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:0 4px 15px rgba(32,50,89,.035);}
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .status-card{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;background:var(--card);box-shadow:0 6px 20px rgba(32,50,89,.04);}
  .status-strip{width:7px;flex-shrink:0;}
  .status-strip.vacant{background:var(--vacant);}
  .status-strip.occupied{background:var(--occupied);}
  .status-strip.pending{background:var(--pending);}
  .status-body{padding:21px 22px;flex:1;background:var(--card);}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;letter-spacing:.01em;}
  .badge.vacant{background:var(--vacant-bg);color:var(--vacant);}
  .badge.occupied{background:var(--occupied-bg);color:var(--occupied);}
  .badge.pending{background:var(--pending-bg);color:var(--pending);}
  .room-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;}
  .room-item{border:1px solid var(--border);border-radius:15px;padding:17px;background:var(--card);box-shadow:0 3px 10px rgba(32,50,89,.025);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;}
  .room-item:hover{transform:translateY(-2px);border-color:#d3daf1;box-shadow:0 12px 24px rgba(32,50,89,.08);}
  .room-item .rname{font-family:'Source Serif 4',serif;font-size:18px;font-weight:600;}
  .room-item .rloc{font-size:12px;color:var(--ink-soft);margin:5px 0 10px;}
  .btn-sm{min-height:34px;padding:7px 12px;border-radius:9px;border:1px solid #dfe5ef;background:#fff;font-size:12px;font-weight:600;color:#344157;}
  .btn-sm:hover{border-color:#a9acef;color:var(--forest);transform:translateY(-1px);box-shadow:0 5px 10px rgba(39,55,93,.08);}
  .btn-sm.primary{background:var(--forest);color:#fff;border-color:var(--forest);box-shadow:0 5px 10px rgba(85,88,233,.18);}
  .btn-sm.primary:hover{background:var(--forest-light);color:#fff;border-color:var(--forest-light);}
  .btn-sm.danger{color:var(--occupied);border-color:#ffd5dc;background:#fffafb;}
  .btn-sm.danger:hover{background:var(--occupied-bg);border-color:#ffc2cc;color:#ba3549;}
  .inline-form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .inline-form .field{margin-bottom:0;flex:1;min-width:145px;}
  .empty{padding:31px 22px;text-align:center;color:var(--ink-soft);font-size:13px;border:1px dashed #cfd8e8;border-radius:15px;background:rgba(255,255,255,.55);line-height:1.6;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7c879a;padding:10px 10px;border-bottom:1px solid var(--border);}
  td{padding:12px 10px;border-bottom:1px solid #edf0f5;color:#38455b;}
  tr:last-child td{border-bottom:none;}
  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border);}
  .tab-btn{padding:9px 4px;margin-right:18px;background:none;border:none;font-size:13.5px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tab-btn.active{color:var(--ink);font-weight:600;border-bottom-color:var(--forest);}
  .avatar{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#6568f0,#8b8df5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
  .person-row{display:flex;align-items:center;gap:10px;}
  .person-name{font-size:13.5px;font-weight:600;}
  .person-sub{font-size:11.5px;color:var(--ink-soft);}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(17,27,56,.5);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--card);border-radius:22px;padding:28px;max-width:370px;width:100%;text-align:center;box-shadow:0 26px 80px rgba(11,18,39,.3);}
  .modal h3{font-size:22px;margin-bottom:5px;}
  .modal .rid{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:19px;}
  #qrbox{display:flex;justify-content:center;margin-bottom:18px;}
  .scan-video-wrap{position:relative;border-radius:15px;overflow:hidden;background:#111;margin-bottom:14px;}
  .scan-video-wrap video{width:100%;display:block;}
  .scan-frame{position:absolute;inset:14%;border:2px solid #fff;border-radius:12px;box-shadow:0 0 0 999px rgba(17,27,56,.16);pointer-events:none;}
  .msg-banner{padding:11px 13px;border-radius:11px;font-size:13px;margin-bottom:16px;}
  .msg-banner.ok{background:var(--vacant-bg);color:var(--vacant);}
  .msg-banner.warn{background:var(--pending-bg);color:var(--pending);}
  .msg-banner.err{background:var(--occupied-bg);color:var(--occupied);}

  /* ---------- Loading ---------- */
  .loading-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 75% 18%,#e5e8ff 0,transparent 27rem),radial-gradient(circle at 15% 88%,#e1f8f2 0,transparent 25rem),#f5f7fb;}
  .loading-card{width:min(100%,390px);padding:40px 34px 34px;text-align:center;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);border-radius:26px;box-shadow:0 25px 70px rgba(45,59,107,.13);backdrop-filter:blur(14px);}
  .loader-orbit{width:70px;height:70px;margin:0 auto 24px;border:2px solid #e3e6fb;border-radius:23px;display:grid;place-items:center;animation:loader-float 2.4s ease-in-out infinite;}
  .loader-core{position:relative;width:39px;height:39px;border-radius:13px;background:linear-gradient(145deg,#6266f2,#4549d8);box-shadow:0 8px 17px rgba(85,88,233,.28);}
  .loader-core::before,.loader-core::after{content:'';position:absolute;border-radius:50%;background:#fff;animation:loader-pulse 1.2s ease-in-out infinite;}
  .loader-core::before{width:7px;height:7px;left:10px;top:16px;}
  .loader-core::after{width:7px;height:7px;right:10px;top:16px;animation-delay:.22s;}
  .loading-card h2{font-size:25px;}
  .loading-card p{margin:8px auto 23px;color:var(--ink-soft);font-size:13px;line-height:1.55;max-width:250px;}
  .loading-bars{display:flex;justify-content:center;gap:5px;}
  .loading-bars i{width:30px;height:4px;border-radius:999px;background:#e4e7f6;overflow:hidden;position:relative;}
  .loading-bars i::after{content:'';position:absolute;inset:0;background:var(--forest);transform:translateX(-110%);animation:loader-line 1.25s ease-in-out infinite;}
  .loading-bars i:nth-child(2)::after{animation-delay:.15s;}.loading-bars i:nth-child(3)::after{animation-delay:.3s;}
  .teacher-directory{overflow:hidden;padding:0;}
  .teacher-directory-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--border);}
  .teacher-directory-head h3{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:700;letter-spacing:0;}
  .teacher-count{color:var(--forest);background:#eef0ff;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;}
  .teacher-list-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid #edf0f5;}
  .teacher-list-item:last-child{border-bottom:none;}
  .teacher-list-item .person-sub{margin-top:2px;}
  .teacher-list-item .btn-sm{flex-shrink:0;}
  @keyframes loader-float{50%{transform:translateY(-5px) rotate(3deg);}}
  @keyframes loader-pulse{50%{transform:scale(.45);opacity:.55;}}
  @keyframes loader-line{50%,100%{transform:translateX(110%);}}
  @media(max-width:760px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;min-height:0;flex-direction:row;align-items:center;padding:13px 14px;overflow:auto;}
    .sb-plate{margin:0 12px 0 0;padding:0;border:none;min-width:max-content;}
    .sb-spacer{display:none;}
    .nav-item{display:inline-flex;width:auto;margin-right:3px;white-space:nowrap;padding:9px 10px;}
    .logout-btn{margin-left:auto;min-width:max-content;}
    .main{padding:28px 20px 36px;}
    .topbar{margin-bottom:28px;}.topbar-user span{display:none;}
    .page-head h2{font-size:28px;}
    .room-list{grid-template-columns:1fr;}
    .login-card{padding:34px 26px;}
  }
  @media(max-width:470px){.login-wrap{padding:18px;}.topbar-brand{font-size:11px;}.page-head p{font-size:13px;}.inline-form .field{min-width:100%;}table{font-size:12px;}.card{padding:16px;}}

  /* ---------- Legacy-inspired redesign: Lato / neutral campus palette ---------- */
  :root{
    --bg:#EBEBEB;
    --card:#FFFFFF;
    --ink:#121318;
    --ink-soft:#696969;
    --forest:#3579F6;
    --forest-light:#2866D6;
    --brass:#D8725C;
    --vacant:#2E9C6A;
    --vacant-bg:#E8F5EE;
    --occupied:#CB444A;
    --occupied-bg:#FBEDEF;
    --pending:#D8725C;
    --pending-bg:#FCEEEA;
    --border:#DCDCDC;
    --navy:#545454;
    --navy-soft:#696969;
    --radius:12px;
    --shadow:0 1px 2px rgba(18,19,24,.06),0 8px 24px -12px rgba(18,19,24,.22);
  }
  html{background:var(--bg);}
  body{background:var(--bg);color:var(--ink);font-family:'Lato',sans-serif;font-weight:400;}
  h1,h2,h3,h4{font-family:'Lato',sans-serif;font-weight:700;letter-spacing:-.025em;}
  button,input,select{font-family:'Lato',sans-serif;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(53,121,246,.24);outline-offset:2px;}
  ::selection{background:#CFE0FF;color:var(--ink);}
  .eyebrow{color:var(--ink-soft);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;}

  /* Login */
  .login-shell{display:grid;min-height:100vh;grid-template-columns:minmax(420px,1.1fr) minmax(430px,1fr);}
  .brand-panel{position:relative;display:flex;flex-direction:column;overflow:hidden;padding:48px clamp(42px,7vw,105px);background:var(--navy);color:#fff;}
  .brand-panel::before,.brand-panel::after{content:'';position:absolute;border-radius:50%;filter:blur(48px);pointer-events:none;}
  .brand-panel::before{width:430px;height:430px;right:-160px;top:-120px;background:rgba(53,121,246,.30);}
  .brand-panel::after{width:350px;height:350px;left:-150px;bottom:-145px;background:rgba(216,114,92,.24);}
  .brand-line{position:relative;z-index:1;display:flex;align-items:center;gap:12px;}
  .mark{display:grid;place-items:center;width:40px;height:40px;flex:0 0 auto;border:1px solid rgba(255,255,255,.32);border-radius:50%;background:var(--brass);color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.14);font-size:12px;font-weight:800;letter-spacing:.03em;overflow:hidden;}
  .brand-name{font-size:15px;font-weight:800;letter-spacing:-.02em;}
  .brand-school{margin-top:2px;color:rgba(255,255,255,.62);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
  .brand-copy{position:relative;z-index:1;max-width:480px;margin:auto 0;}
  .brand-copy .eyebrow{color:#fff;margin-bottom:12px;opacity:.66;}
  .brand-copy h1{max-width:440px;color:#fff;font-size:clamp(35px,3.4vw,48px);font-weight:800;line-height:1.05;}
  .brand-copy p{max-width:450px;margin:16px 0 0;color:rgba(255,255,255,.74);font-size:15px;line-height:1.7;}
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px;}
  .mini-stat{padding:12px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:rgba(255,255,255,.08);}
  .mini-stat strong{display:block;color:#fff;font-size:18px;font-weight:800;}.mini-stat span{color:rgba(255,255,255,.65);font-size:12px;}
  .login-panel{display:grid;place-items:center;padding:40px 24px;background:radial-gradient(circle at 85% 12%,rgba(53,121,246,.07),transparent 60%),radial-gradient(circle at 10% 90%,rgba(216,114,92,.06),transparent 55%),#fff;}
  .login-form{width:100%;max-width:420px;}.mobile-brand{display:none;margin-bottom:34px;}
  .login-card{width:100%;max-width:none;padding:30px 28px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 18px 45px -20px rgba(18,19,24,.18);backdrop-filter:none;}
  .login-wrap{display:contents;min-height:0;padding:0;overflow:visible;}.login-wrap::before,.login-wrap::after{display:none;}
  .plate{display:block;margin:24px 0 4px;}.plate-num{display:none;}.plate .eyebrow{display:none;}
  .plate-title{font-size:25px;font-weight:700;line-height:1.15;}.plate-sub{margin-top:4px;color:var(--ink-soft);font-size:14px;}
  .switcher{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:4px;border-radius:10px;background:var(--bg);}
  .switcher button{border:0;border-radius:7px;padding:9px;background:transparent;color:var(--ink-soft);font-size:13px;font-weight:700;}
  .switcher button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow);}

let PENDING_PROFILE_IMAGE;
function previewProfilePicture(input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    input.value = '';
    setInlineMessage('profile-message', 'err', 'Choose an image file (JPG, PNG, or WebP).');
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => setInlineMessage('profile-message', 'err', 'The selected image could not be opened.');
  reader.onload = event => {
    const image = new Image();
    image.onerror = () => setInlineMessage('profile-message', 'err', 'The selected image could not be processed.');
    image.onload = () => {
      const maxEdge = 512;
      const scale = Math.min(1, maxEdge / Math.max(image.width, image.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
      PENDING_PROFILE_IMAGE = canvas.toDataURL('image/jpeg', .82);
      const preview = document.getElementById('profile-photo-preview');
      if(preview) preview.innerHTML = `<img src="${PENDING_PROFILE_IMAGE}" alt="New profile preview">`;
      setInlineMessage('profile-message', 'ok', 'Photo ready. Save your information to keep it.');
    };
    image.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

function saveProfile(){
  const user = currentUserRecord();
  const nameInput = document.getElementById('profile-name');
  const name = nameInput.value.trim();
  if(!name){ nameInput.reportValidity(); nameInput.focus(); return; }

  const previousName = user.name;
  user.name = name;
  if(user.role === 'student'){
    const studentId = document.getElementById('profile-student-id');
    const year = document.getElementById('profile-year');
    const block = document.getElementById('profile-block');
    if(!studentId.value.trim() || !year.value.trim() || !block.value.trim()){
      const firstMissing = [studentId, year, block].find(input => !input.value.trim());
      firstMissing.reportValidity(); firstMissing.focus(); return;
    }
    user.student_id = studentId.value.trim(); user.year = year.value.trim(); user.block = block.value.trim();
  }
  if(user.role === 'teacher'){
    const subject = document.getElementById('profile-subject');
    if(!subject.value.trim()){ subject.reportValidity(); subject.focus(); return; }
    user.class_subject = subject.value.trim();
  }
  if(PENDING_PROFILE_IMAGE !== undefined) user.profile_image = PENDING_PROFILE_IMAGE;

  if(previousName !== user.name){
    RESERVATIONS.forEach(item => { if(String(item.teacher_id) === String(user.id)) item.teacher_name = user.name; });
    ACTIVITY_LOGS.forEach(item => { if(String(item.teacher_id) === String(user.id)) item.teacher_name = user.name; });
    FOLLOWS.forEach(item => {
      if(String(item.teacher_id) === String(user.id)) item.teacher_name = user.name;
      if(String(item.student_id) === String(user.id)) item.student_name = user.name;
    });
  }
  const { password, ...safeUser } = user;
  CURRENT_USER = safeUser;
  PENDING_PROFILE_IMAGE = undefined;
  notifyUpdate('Saved on this device. (Profile details aren\'t stored on the server yet.)', 'success', 'Profile updated');
}

async function saveProfile(){
  const user = currentUserRecord();
  const nameInput = document.getElementById('profile-name');
  const name = nameInput.value.trim();
  if(!name){ nameInput.reportValidity(); nameInput.focus(); return; }

  let student_id = user.student_id || null;
  let course = user.course || null;
  let year = user.year || null;
  let block = user.block || null;
  let class_subject = user.class_subject || null;

  if(user.role === 'student'){
    const studentIdInput = document.getElementById('profile-student-id');
    const courseInput = document.getElementById('profile-course');
    const yearInput = document.getElementById('profile-year');
    const blockInput = document.getElementById('profile-block');
     if(!studentIdInput.value.trim() || !courseInput.value.trim() || !yearInput.value.trim() || !blockInput.value.trim()){
      const firstMissing = [studentIdInput, courseInput, yearInput, blockInput].find(input => !input.value.trim());
      firstMissing.reportValidity(); firstMissing.focus(); return;
    }
    if(!/^\d{6}$/.test(studentIdInput.value.trim())){
      studentIdInput.setCustomValidity('Student ID must be exactly 6 numbers.');
      studentIdInput.reportValidity();
      studentIdInput.setCustomValidity('');
      studentIdInput.focus();
      return;
    }
    student_id = studentIdInput.value.trim(); course = courseInput.value.trim(); year = yearInput.value.trim(); block = blockInput.value.trim();
  }
  if(user.role === 'teacher'){
    const subjectInput = document.getElementById('profile-subject');
    if(!subjectInput.value.trim()){ subjectInput.reportValidity(); subjectInput.focus(); return; }
    class_subject = subjectInput.value.trim();
  }

  const profile_image = PENDING_PROFILE_IMAGE !== undefined ? PENDING_PROFILE_IMAGE : (user.profile_image || null);

  try{
    const response = await fetch(`${API_BASE}/api/users/${user.id}/profile`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
       body: JSON.stringify({ name, profile_image, student_id, course, year, block, class_subject })
    });
    const data = await response.json();
    if(!response.ok){
      setInlineMessage('profile-message', 'err', data.error || 'Failed to save profile.');
      return;
    }

    CURRENT_USER = data.user;
    PENDING_PROFILE_IMAGE = undefined;
    await loadUsersFromServer();
    notifyUpdate('Your profile has been saved.', 'success', 'Profile updated');
  }catch(error){
    console.error('SAVE PROFILE ERROR:', error);
    setInlineMessage('profile-message', 'err', 'Cannot connect to the server.');
  }
}

function persistWorkspace(){
  if(!CURRENT_USER) return;
  const payload = JSON.stringify({
    user: CURRENT_USER,
    tab: VIEW.tab,
    searchQ: VIEW.searchQ || '',
    expiresAt: REMEMBER_ME ? (Date.now() + REMEMBER_DURATION_MS) : null
  });
  if(REMEMBER_ME){
    localStorage.setItem(SESSION_KEY, payload);
    sessionStorage.removeItem(SESSION_KEY);
  }else{
    sessionStorage.setItem(SESSION_KEY, payload);
    localStorage.removeItem(SESSION_KEY);
  }
}
function getPersistedWorkspace(){
  try{
    const fromLocal = localStorage.getItem(SESSION_KEY);
    const raw = fromLocal || sessionStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const saved = JSON.parse(raw);
    if(!saved || !saved.user || !saved.user.id || !saved.user.role) return null;
    if(fromLocal && saved.expiresAt && Date.now() > saved.expiresAt){
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return saved;
  }catch(error){
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SESSION_KEY);
    return null;
  }
}

function captureRegDraft(){
  const nameInput = document.getElementById('rg-name');
  const emailInput = document.getElementById('rg-email');
  const passInput = document.getElementById('rg-pass');
  const passConfirmInput = document.getElementById('rg-pass-confirm');

  if(nameInput) REG_DRAFT.name = nameInput.value;
  if(emailInput) REG_DRAFT.email = emailInput.value;

  if(passConfirmInput) REG_DRAFT.confirmPassword = passConfirmInput.value;
  if(subjectInput) REG_DRAFT.subject = subjectInput.value;
}
function guessErrorField(message){
  const m = (message||'').toLowerCase();
  if(m.includes('do not match')) return ['password','confirmPassword'];
  if(m.includes('password')) return ['password'];
  if(m.includes('email')) return ['email'];
  if(m.includes('subject')) return ['subject'];
  if(m.includes('name')) return ['name'];
  return [];
}
function errMark(key){

async function doLogin(){
  const u = document.getElementById('li-user').value.trim();
  const p = document.getElementById('li-pass').value;
  const remember = document.getElementById('li-remember').checked;

  if(!u || !p){
    VIEW.err = 'Please enter your username and password.';
    render();
    return;
  }

  REMEMBER_ME = remember;
  try{
    localStorage.setItem('crs-remember-me', remember ? '1' : '0');
    localStorage.setItem('crs-last-username', u);
  }catch(e){}

  try{
    const response = await fetch(API_BASE + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await response.json();

    if(!response.ok){
      VIEW.err = data.error || 'Incorrect username or password.';
      render();
      return;
    }

    CURRENT_USER = data.user;
    setLoading(true, 'Opening your workspace', 'Signing you in.');
    render();
    await Promise.all([loadWorkspaceData(), wait(450)]);

    setLoading(false);
    VIEW = {
      screen: CURRENT_USER.role,
      tab: defaultTab(CURRENT_USER.role),
      err: ''
    };

    persistWorkspace();
    render();
    startPolling();

  }catch(error){
    console.error(error);
    VIEW.err = 'Cannot connect to the server.';
    render();
  }
}

async function doRegister(){

    const name = document.getElementById('rg-name').value.trim();
    const email = document.getElementById('rg-email').value.trim();
    const p = document.getElementById('rg-pass').value;
    const pConfirm = document.getElementById('rg-pass-confirm').value;

    captureRegDraft();

    if(!name || !email || !p || !pConfirm){
        VIEW.err = 'Please fill in every field.';
        VIEW.errField = [!name?'name':null, !email?'email':null, !p?'password':null, !pConfirm?'confirmPassword':null].filter(Boolean);
        render();
        return;
    }

    if(p.length < 8){
        VIEW.err = 'Password must be at least 8 characters.';
        VIEW.errField = ['password'];
        render();
        return;
    }

    if(p !== pConfirm){
        VIEW.err = 'Passwords do not match.';
        VIEW.errField = ['password','confirmPassword'];
        render();
        return;
    }

    try {

        if(REG_ROLE === 'student'){
            setLoading(true, 'Verifying your account', 'Sending a verification code to your email.');
            render();

            const response = await fetch(API_BASE + '/api/register/student', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password: p, confirmPassword: pConfirm })
            });
            const data = await response.json();

            setLoading(false);

            if(!response.ok){
                VIEW.err = data.error || 'Registration failed.';
                VIEW.errField = guessErrorField(VIEW.err);
                render();
                return;
            }

            PENDING_VERIFY_USERNAME = data.username;
            AUTH_MODE = 'verify';
            VIEW.err = '';
            VIEW.errField = [];
            render();
            return;
        }

        const subject = document.getElementById('rg-subject').value.trim();
        if(!subject){
            VIEW.err = 'Please fill in every field.';
            VIEW.errField = ['subject'];
            render();
            return;
        }

        setLoading(true, 'Creating your workspace', 'Setting up your account.');
        render();

        const response = await fetch(API_BASE + '/api/register/teacher', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password: p, confirmPassword: pConfirm, class_subject: subject })
        });
        const data = await response.json();

        setLoading(false);

        if(!response.ok){
            VIEW.err = data.error || 'Registration failed.';
            VIEW.errField = guessErrorField(VIEW.err);
            render();
            return;
        }

        AUTH_MODE = 'login';
        VIEW.err = '';
        VIEW.errField = [];
        VIEW.notice = { type:'ok', text: data.message };
        render();

    } catch(error) {

        console.error('REGISTRATION ERROR:', error);

        setLoading(false);
        VIEW.err = 'Cannot connect to the server.';
        render();
    }
}

async function doVerifyCode(){
  const code = document.getElementById('vf-code').value.trim();

    const response = await fetch(API_BASE + '/api/verify-code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },

    });
    const data = await response.json();

    if(!response.ok){
      setLoading(false);

      render();
      return;
    }

    CURRENT_USER = data.user;

    setLoading(false);
    VIEW = {
      screen: CURRENT_USER.role,
      tab: defaultTab(CURRENT_USER.role),

    };

  }catch(error){

  }
}

function getSeenSet(key){
  try{
    const raw = localStorage.getItem(`crs-seen-${key}-${CURRENT_USER.id}`);
    return new Set(JSON.parse(raw) || []);
  }catch(error){
    return new Set();
  }
}
function markSeen(key, ids){
  if(!ids.length) return;
  try{
    const current = getSeenSet(key);
    ids.forEach(id => current.add(id));
    localStorage.setItem(`crs-seen-${key}-${CURRENT_USER.id}`, JSON.stringify([...current]));
  }catch(error){
    console.warn('Could not save notification state.', error);
  }
}
function pendingReservationCount(){
  return RESERVATIONS.filter(r => r.status === 'pending').length;
}

function pendingFollowRequestCount(){
  return FOLLOWS.filter(f => f.teacher_id === CURRENT_USER.id && f.status === 'pending').length;
}

function unseenReservationUpdates(){
  const mine = RESERVATIONS.filter(r => String(r.teacher_id) === String(CURRENT_USER.id) && (r.status === 'approved' || r.status === 'cancelled'));
  const seen = getSeenSet('reservations');
  return mine.filter(r => !seen.has(r.id));
}
function unseenFollowedCheckins(){
  const followedTeacherIds = FOLLOWS.filter(f => f.student_id === CURRENT_USER.id && f.status === 'accepted').map(f => f.teacher_id);
  const logs = ACTIVITY_LOGS.filter(l => l.action === 'check-in' && followedTeacherIds.includes(l.teacher_id));
  const seen = getSeenSet('checkins');
  return logs.filter(l => !seen.has(l.id));
}

function unseenAcceptedFollows(){
  const mine = FOLLOWS.filter(f => f.student_id === CURRENT_USER.id && f.status === 'accepted');
  const seen = getSeenSet('accepted-follows');
  return mine.filter(f => !seen.has(f.id));
}

  if(CURRENT_USER.role === 'admin' && tabKey === 'approvals') return PENDING_TEACHERS.length;
  if(CURRENT_USER.role === 'teacher' && tabKey === 'followers') return pendingFollowRequestCount();
  if(CURRENT_USER.role === 'student' && tabKey === 'follows') return unseenFollowedCheckins().length + unseenAcceptedFollows().length;

}

async function changePassword(){
  const user = currentUserRecord();
  const currentInput = document.getElementById('pw-current');
  const newInput = document.getElementById('pw-new');
  const confirmInput = document.getElementById('pw-confirm');

  if(newInput.value !== confirmInput.value){
    setInlineMessage('password-message', 'err', 'New passwords do not match.');
    return;
  }

  try{
    const response = await fetch(`${API_BASE}/api/users/${user.id}/password`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ currentPassword: currentInput.value, newPassword: newInput.value })
    });
    const data = await response.json();
    if(!response.ok){
      setInlineMessage('password-message', 'err', data.error || 'Failed to change password.');
      return;
    }
    currentInput.value = ''; newInput.value = ''; confirmInput.value = '';
    setInlineMessage('password-message', 'ok', 'Password changed successfully.');
  }catch(error){
    console.error('CHANGE PASSWORD ERROR:', error);
    setInlineMessage('password-message', 'err', 'Cannot connect to the server.');
  }
}

async function addRoom(){
  const nameInput = document.getElementById('rm-name');
  const name = nameInput.value.trim();
  const bldg = document.getElementById('rm-bldg').value.trim();
  const floor = document.getElementById('rm-floor').value.trim();

  if(!name){
    nameInput.reportValidity();
    nameInput.focus();
    return;
  }

  const roomCode = 'R' + Date.now();

  try{
    const response = await fetch(API_BASE + '/api/rooms', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room_code: roomCode, name, building: bldg || null, floor: floor || null })
    });
    const data = await response.json();
    if(!response.ok){
      queueToast(data.error || 'Failed to add room.', 'error', 'Unable to add room');
      render();
      return;

    await loadRoomsFromServer();
    notifyUpdate('The room is ready for a QR code.', 'success', 'Room added');

    console.error('ADD ROOM ERROR:', error);
    queueToast('Cannot connect to the server.', 'error', 'Unable to add room');
    render();
  }
}

const DAY_NAMES = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

function manilaNow(){
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone:'Asia/Manila', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
  }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  const date = `${get('year')}-${get('month')}-${get('day')}`;
  const time = `${get('hour')}:${get('minute')}:${get('second')}`;
  return { date, time, full:`${date} ${time}` };
}
function weekDates(){
  const now = manilaNow();
  const base = new Date(now.date + 'T00:00:00Z');
  const jsDay = base.getUTCDay();
  const iso = jsDay === 0 ? 7 : jsDay;
  base.setUTCDate(base.getUTCDate() - (iso - 1));
  return Array.from({length:7}, (_, i) => {
    const d = new Date(base);
    d.setUTCDate(base.getUTCDate() + i);
    return d.toISOString().slice(0,10);
  });
}
function isRoomFixedScheduledNow(roomId){
  const now = manilaNow();
  const jsDay = new Date(now.date + 'T00:00:00Z').getUTCDay();
  const day = jsDay === 0 ? 7 : jsDay;
  return SCHEDULES.some(s => s.room_id === roomId && s.day_of_week === day && s.start_time <= now.time && s.end_time > now.time);
}
function roomLive(room){
  const now = manilaNow();
  if(room.status === 'occupied'){
    const teacher = SERVER_USERS.find(u => String(u.id) === String(room.teacher_id));
    const session = RESERVATIONS.find(r => r.room_id === room.id && r.status === 'approved' && String(r.teacher_id) === String(room.teacher_id) && r.start_time <= now.full && r.end_time > now.full);
    return { state:'occupied', teacher, session };
  }
  if(isRoomFixedScheduledNow(room.id)) return { state:'scheduled' };
  return { state:'vacant' };
}

function formatTime12(t){
  if(!t) return '';
  const [h,m] = t.split(':').map(Number);
  const period = h >= 12 ? 'PM' : 'AM';
  const hour12 = h % 12 === 0 ? 12 : h % 12;
  return `${hour12}:${String(m).padStart(2,'0')} ${period}`;
}

function renderScheduleGrid(editable){
  const buildings = [...new Set(ROOMS.map(r => r.building).filter(Boolean))].sort();
  if(!VIEW.scheduleBuilding || !buildings.includes(VIEW.scheduleBuilding)){
    VIEW.scheduleBuilding = buildings[0] || '';
  }
  const buildingRooms = ROOMS.filter(r => r.building === VIEW.scheduleBuilding);
  const dates = weekDates();
  const now = manilaNow();

  const roomCell = room => {
    const live = roomLive(room);
    let badge = `<span class="badge vacant">Vacant</span>`;
    let extra = '';
    if(live.state === 'occupied'){
      badge = `<span class="badge occupied">Occupied</span>`;
      const who = live.teacher ? live.teacher.name : 'Unknown teacher';
      const until = live.session ? ` · until ${formatTime12(live.session.end_time.slice(11))}` : '';
      extra = `<div class="hint" style="margin-top:4px;">${who}${until}</div>`;
    }else if(live.state === 'scheduled'){
      badge = `<span class="badge" style="background:#E2E2E2;color:#545454;">Fixed class now</span>`;
    }
    return `<strong>${room.name}</strong><div style="margin-top:6px;">${badge}</div>${extra}`;
  };

  const dayCell = (room, idx) => {
    const dow = idx + 1;
    const date = dates[idx];
    const fixed = SCHEDULES.filter(s => s.room_id === room.id && s.day_of_week === dow);
    const booked = RESERVATIONS.filter(r => r.room_id === room.id && r.status === 'approved' && r.start_time.slice(0,10) === date && r.end_time > now.full);

    const overriddenByBooking = s => booked.some(r => r.start_time.slice(11) < s.end_time && r.end_time.slice(11) > s.start_time);

    const fixedBlocks = fixed.filter(s => !overriddenByBooking(s)).map(s => {
      const timeText = `${formatTime12(s.start_time)}&ndash;${formatTime12(s.end_time)}`;
      const inner = `<div class="sched-chip-time">${timeText}</div>${s.label ? `<div class="sched-chip-label">${s.label}</div>` : ''}`;
      return editable
        ? `<div class="sched-chip" style="background:#E2E2E2;color:#333;cursor:pointer;" onclick="openScheduleModal(${room.id}, ${dow}, ${s.id})">${inner}</div>`
        : `<div class="sched-chip" style="background:#E2E2E2;color:#333;">${inner}</div>`;
    }).join('');

    const bookedBlocks = booked.map(r => {
      const isLive = room.status === 'occupied' && String(room.teacher_id) === String(r.teacher_id) && r.start_time <= now.full;
      const colors = isLive ? 'background:var(--occupied-bg);color:#A5343A;' : 'background:var(--pending-bg);color:#A85745;';
      const timeText = `${formatTime12(r.start_time.slice(11))}&ndash;${formatTime12(r.end_time.slice(11))}`;
      return `<div class="sched-chip" style="${colors}"><div class="sched-chip-time">${timeText}</div><div class="sched-chip-label">${r.teacher_name}</div></div>`;
    }).join('');

    const empty = !editable && fixed.length === 0 && booked.length === 0 ? `<span class="hint">&mdash;</span>` : '';
    const addBtn = editable ? `<button type="button" class="btn-sm" onclick="openScheduleModal(${room.id}, ${dow}, null)">${icon('plus')}Add</button>` : '';

    return `<td style="vertical-align:top;min-width:125px;${date === now.date ? 'background:#F6F9FF;' : ''}"><div style="display:flex;flex-direction:column;gap:4px;">${fixedBlocks}${bookedBlocks}${empty}${addBtn}</div></td>`;
  };

  return `
    <div class="page-head" style="margin-top:26px;"><h3 style="font-size:16px;">Fixed Schedule</h3></div>
    ${buildings.length === 0 ? `<div class="empty">No buildings yet.</div>` : `
    <div class="field" style="max-width:280px;margin-bottom:12px;">
      <label>Building</label>
      <select onchange="setScheduleBuilding(this.value)">
        ${buildings.map(b => `<option value="${escapeAttr(b)}" ${b===VIEW.scheduleBuilding?'selected':''}>${b}</option>`).join('')}
      </select>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
      <span class="badge" style="background:#E2E2E2;color:#545454;">Fixed class</span>
      <span class="badge pending">Reserved</span>
      <span class="badge occupied">Occupied</span>
    </div>

    <div class="card table-card" style="overflow-x:auto;margin-bottom:26px;">
      <table style="min-width:920px;">
        <thead>
          <tr>
            <th style="min-width:150px;">Room</th>
            ${DAY_NAMES.map((d, i) => `<th>${d.slice(0,3)}<br><span style="font-weight:400;letter-spacing:0;">${dates[i].slice(5).replace('-','/')}</span></th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${buildingRooms.length === 0 ? `<tr><td colspan="8"><div class="empty" style="border:0;">No rooms in this building yet.</div></td></tr>` : buildingRooms.map(room => `
            <tr>
              <td style="vertical-align:top;">${roomCell(room)}</td>
              ${DAY_NAMES.map((_, idx) => dayCell(room, idx)).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    `}
  `;
}

  const label = document.getElementById('sched-label').value.trim();

  if(!start || !end){
    setInlineMessage('schedule-message', 'err', 'Start and end time are required.');
    return;

  const payload = { room_id: m.roomId, day_of_week: m.dayOfWeek, start_time: start, end_time: end, label: label || null };

  try{
    const response = m.editingId
      ? await fetch(`${API_BASE}/api/schedules/${m.editingId}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) })
      : await fetch(`${API_BASE}/api/schedules`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });

    const data = await response.json();
    if(!response.ok){
      setInlineMessage('schedule-message', 'err', data.error || 'Failed to save schedule.');

async function createReservation(){

  const roomInput = document.getElementById('reservation-room');
  const dateInput = document.getElementById('reservation-date');
  const startInput = document.getElementById('reservation-start');
  const endInput = document.getElementById('reservation-end');
  const roomId = roomInput.value;
  const date = dateInput.value;
  const start = startInput.value;
  const end = endInput.value;

  if(!roomId || !date || !start || !end){
    const firstMissing = [roomInput,dateInput,startInput,endInput].find(input => !input.value);
    firstMissing?.reportValidity();
    firstMissing?.focus();
    return;
  }

  const startTime = `${date} ${start}:00`;
  const endTime = `${date} ${end}:00`;
  if(new Date(endTime) <= new Date(startTime)){
    endInput.setCustomValidity('End time must be later than the start time.');
    endInput.reportValidity();
    endInput.setCustomValidity('');
    endInput.focus();
    return;
  }
  try{
    const response = await fetch(API_BASE + '/api/reservations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room_id: roomId, teacher_id: CURRENT_USER.id, start_time: startTime, end_time: endTime })
    });
    const data = await response.json();
    if(!response.ok){
      if(data.scheduleConflict){
        setInlineMessage('reservation-message', 'warn', `This room has a fixed sched at ${formatTime12(data.schedule_start)} – ${formatTime12(data.schedule_end)}${data.label ? ` (${data.label})` : ''}.<br><button type="button" class="btn-sm" style="margin-top:8px;" onclick="focusReservationRoom()">Find another room and adjust reservation</button>`);
      }else{
        setInlineMessage('reservation-message', 'warn', data.error || 'That room is already reserved during this time.');
      }
      return;
    }
    await loadReservationsFromServer();
    notifyUpdate('Your reservation is confirmed.', 'success', 'Reservation confirmed');
  }catch(error){
    console.error('CREATE RESERVATION ERROR:', error);
    setInlineMessage('reservation-message', 'err', 'Cannot connect to the server.');
  }
}

  const reservation = RESERVATIONS.find(item => Number(item.id) === Number(reservationId));

    render();

  requestConfirmation({

    actionLabel:'Cancel reservation'
  }, async () => {

async function setupCameraIfNeeded(){
  if(SCAN.stream) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' } });
    SCAN.stream = stream;
    const video = document.getElementById('scan-video');
    if(!video) return;
    video.srcObject = stream;
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    function tick(){
      if(!SCAN.active) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = typeof jsQR!=='undefined' ? jsQR(imgData.data, imgData.width, imgData.height) : null;
        if(code && code.data){ handleScannedCode(code.data); return; }
      }
      SCAN.raf = requestAnimationFrame(tick);
    }
    SCAN.raf = requestAnimationFrame(tick);
  }catch(e){
    SCAN.active = false;
    VIEW.notice = { type:'warn', text:"Couldn't reach the camera in this environment. Use the manual code entry below instead." };
    render();
  }
}
function stopScanner(){
  SCAN.active = false;
  if(SCAN.raf) cancelAnimationFrame(SCAN.raf);
  if(SCAN.stream){ SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; }
}

async function handleScannedCode(data){
  stopScanner();
  const match = /^CRS-ROOM-(.+)$/.exec((data || '').trim());
  if(!match){
    VIEW.notice = { type:'err', text:'That code is not a recognized room QR.' };
    render();
    return;
  }

  await loadRoomsFromServer();
  const room = ROOMS.find(item => String(item.room_code) === String(match[1]));
  if(!room){
    VIEW.notice = { type:'err', text:'That room no longer exists.' };
    render();
    return;
  }

  try{
    if(room.status === 'occupied' && String(room.teacher_id) === String(CURRENT_USER.id)){
      const response = await fetch(`${API_BASE}/api/rooms/${room.id}/checkout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ teacher_id: CURRENT_USER.id })
      });
      const result = await response.json();
      if(!response.ok){
        VIEW.notice = { type:'err', text: result.error || 'Failed to check out.' };
        render();
        return;
      }
      VIEW.notice = { type:'ok', text:`Checked out of ${room.name}.` };
    }else if(room.status === 'occupied'){
      VIEW.notice = { type:'err', text:`${room.name} is currently occupied by another teacher.` };
      render();
      return;
    }else{
      await attemptCheckin(room, null, false);
      return;
    }

    await loadRoomsFromServer();
    VIEW.tab = 'scan';
    persistWorkspace();
    render();
  }catch(error){
    console.error('CHECK-IN/OUT ERROR:', error);
    VIEW.notice = { type:'err', text:'Cannot connect to the server.' };
    render();
  }
}

async function attemptCheckin(room, endTime, force){
  try{
    const response = await fetch(`${API_BASE}/api/rooms/${room.id}/checkin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ teacher_id: CURRENT_USER.id, end_time: endTime, force })
    });
    const result = await response.json();

    if(response.status === 422 && result.needsTime){
      openCheckinTimeModal(room);
      return;
    }

    if(response.status === 409 && result.scheduleConflict){
      requestConfirmation({
        title:`This room has a fixed sched at ${formatTime12(result.schedule_start)} – ${formatTime12(result.schedule_end)}`,
        message: result.label ? `${result.label}. If nobody is actually using the room, you can check in instead.` : `If nobody is actually using the room, you can check in instead.`,
        actionLabel:"Room's empty, check in instead",
        tone:'primary'
      }, () => attemptCheckin(room, endTime, true));
      return;
    }

    if(!response.ok){
      VIEW.notice = { type:'err', text: result.error || 'Failed to check in.' };
      render();
      return;
    }

    VIEW.notice = { type:'ok', text:`Checked in to ${room.name}.` };
    await loadRoomsFromServer();
    await loadReservationsFromServer();
    VIEW.tab = 'scan';
    persistWorkspace();
    render();
  }catch(error){
    console.error('CHECK-IN ERROR:', error);
    VIEW.notice = { type:'err', text:'Cannot connect to the server.' };
    render();
  }
}

        await loadFollowsFromServer();
        notifyUpdate(`Your follow request for ${teacher.name} is pending approval.`, 'success', 'Request sent');
    }catch(error){
        console.error('FOLLOW ERROR:', error);
        queueToast('Cannot connect to the server.', 'error', 'Unable to follow');
        render();
    }
}

async function approveFollow(followId){
    try{
        const response = await fetch(`${API_BASE}/api/follows/${followId}/approve`, { method: 'PUT' });
        const data = await response.json();
        if(!response.ok){
            queueToast(data.error || 'Failed to approve follow request.', 'error', 'Unable to approve');
            render();
            return;
        }
        await loadFollowsFromServer();
        notifyUpdate('The student can now see your room status.', 'success', 'Follower approved');
    }catch(error){
        console.error('APPROVE FOLLOW ERROR:', error);
        queueToast('Cannot connect to the server.', 'error', 'Unable to approve');
        render();
    }
}

async function rejectFollow(followId){
    try{
        const response = await fetch(`${API_BASE}/api/follows/${followId}/reject`, { method: 'PUT' });
        const data = await response.json();
        if(!response.ok){
            queueToast(data.error || 'Failed to reject follow request.', 'error', 'Unable to decline');
            render();
            return;
        }
        await loadFollowsFromServer();
        notifyUpdate('The follow request was declined.', 'success', 'Request declined');
    }catch(error){
        console.error('REJECT FOLLOW ERROR:', error);
        queueToast('Cannot connect to the server.', 'error', 'Unable to decline');
        render();
    }
}

function renderStudentFollows(){
    const mine = FOLLOWS.filter(
        f => f.student_id === CURRENT_USER.id
    );

    if(mine.length === 0) return `
        <div class="page-head">
            <h2>My Follows</h2>
            <p>Teachers you're tracking.</p>
        </div>

        <div class="empty">
            You're not following any teacher yet.
            Go to Find Teachers to send a request.
        </div>
    `;

    return `
        <div class="page-head">
            <h2>My Follows</h2>
            <p>Live room status for teachers you follow.</p>
        </div>

        ${mine.map(f => {

            if(f.status === 'pending') return `
                <div class="status-card">
                    <div class="status-strip pending"></div>
                    <div class="status-body">
                        <div class="row-between">
                            <h3 style="font-size:15.5px;">
                                ${f.teacher_name}
                            </h3>
                            <span class="badge pending">
                                Waiting for approval
                            </span>
                        </div>
                    </div>
                </div>
            `;

            if(f.status === 'rejected') return `
                <div class="status-card">
                    <div class="status-strip occupied"></div>
                    <div class="status-body">
                        <div class="row-between">
                            <h3 style="font-size:15.5px;">
                                ${f.teacher_name}
                            </h3>
                            <span class="badge occupied">
                                Request declined
                            </span>
                        </div>
                    </div>
                </div>
            `;

            const room = ROOMS.find(
                r => r.teacher_id === f.teacher_id &&
                     r.status === 'occupied'
            );

            if(room) return `
                <div class="status-card">
                    <div class="status-strip occupied"></div>
                    <div class="status-body">
                        <div class="row-between">
                            <div>
                                <h3 style="font-size:15.5px;">
                                    ${f.teacher_name}
                                </h3>

                                <p class="hint" style="margin-top:3px;">
                                    ${room.name} · ${room.building}
                                </p>
                            </div>

                            <span class="badge occupied">
                                In a room
                            </span>
                        </div>
                    </div>
                </div>
            `;

            return `
                <div class="status-card">
                    <div class="status-strip vacant"></div>
                    <div class="status-body">
                        <div class="row-between">
                            <h3 style="font-size:15.5px;">
                                ${f.teacher_name}
                            </h3>

                            <span class="badge vacant">
                                Not in a room
                            </span>
                        </div>
                    </div>
                </div>
            `;

        }).join('')}
    `;
}

/* ===================== POLLING (live-ish updates) ===================== */
let POLL_TIMER = null;
function startPolling(){
  stopPolling();
  POLL_TIMER = setInterval(async ()=>{
    const active = document.activeElement;
    const typing = active && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA');
    if(typing || SCAN.active || VIEW.confirm || VIEW.tab === 'info' || VIEW.scheduleModal || VIEW.checkinModal || document.querySelector('#reservation-message .msg-banner')) return;

    await loadRoomsFromServer();
    await loadReservationsFromServer();
    await loadActivityLogsFromServer();
    await loadFollowsFromServer();
    await loadUsersFromServer();
    await loadSchedulesFromServer();
    if(CURRENT_USER.role === 'admin'){
      await loadPendingTeachersFromServer();
    }

    if(CURRENT_USER && !SERVER_USERS.some(u => String(u.id) === String(CURRENT_USER.id))){
      performLogout();
      AUTH_MODE = 'login';
      VIEW.err = "You've been removed by the admin.";
      render();
      return;
    }

    render();
  }, 4000);
}
function stopPolling(){ if(POLL_TIMER) clearInterval(POLL_TIMER); POLL_TIMER=null; }

/* ===================== BOOT / REFRESH RESTORE ===================== */
function wait(ms){ return new Promise(resolve => window.setTimeout(resolve, ms)); }
async function restoreWorkspace(){
  const saved = getPersistedWorkspace();

  if(!saved){
    await wait(420);
    setLoading(false);
    render();
    return;
  }

  CURRENT_USER = saved.user;
  const tab = allowedTabs(CURRENT_USER.role).includes(saved.tab)
    ? saved.tab
    : defaultTab(CURRENT_USER.role);
  VIEW = {
    screen: CURRENT_USER.role,
    tab,
    err: '',
    notice: null,
    searchQ: saved.searchQ || ''
  };

  setLoading(true, 'Restoring your workspace', 'Loading your live classroom data and saved view.');
  render();
  await loadWorkspaceData();
  setLoading(false);
  persistWorkspace();
  render();
  startPolling();
}

(async function boot(){
  render();
  await restoreWorkspace();
})();

window.addEventListener('pageshow', function(event){
  if(event.persisted){
    stopPolling();
    stopScanner();
    restoreWorkspace();
  }
});
window.addEventListener('error', function(ev){
  const app = document.getElementById('app');
  if(app && !app.innerHTML.trim()){
    app.innerHTML = `<div style="max-width:520px;margin:60px auto;padding:24px;font-family:sans-serif;">
      <h2 style="font-family:serif;">The app didn't load</h2>
      <p style="color:#6B6355;">${ev.message || 'A script failed to load or run.'}</p>
      <button onclick="location.reload()" style="margin-top:12px;padding:8px 14px;border-radius:6px;border:1px solid #ccc;background:#fff;cursor:pointer;">Reload</button>
    </div>`;
  }
});
</script>
